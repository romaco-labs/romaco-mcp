name: Publish @romaco/mcp

# Stages @romaco/mcp on npm through Trusted Publishing. npm must trust:
#   GitHub org: romaco-labs
#   Repository: romaco-mcp
#   Workflow: publish.yml
#   Allowed action: npm stage publish (direct publish stays disabled)
# No long-lived write token is used or accepted by this workflow. A
# maintainer reviews the staged package on npm and approves it with 2FA;
# that approval, not this workflow, makes the release public.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: npm publish (@romaco/mcp)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance (attestation de supply-chain)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing requires npm >=11.5.1. Pin release tooling so a
      # runner image update cannot silently change publish behavior.
      - name: Pin npm release CLI
        run: npm install --global npm@11.18.0

      - run: npm ci

      - name: Verify tag and release metadata
        run: npm run verify:release-version -- "$GITHUB_REF_NAME"

      - name: Build
        run: npm run build

      - name: Test (release gate)
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Stage on npm through OIDC
        run: npm stage publish --access public

      - name: Record next manual action
        run: |
          {
            echo '### Package staged privately on npm'
            echo ''
            echo "Review the staged @romaco/mcp ${GITHUB_REF_NAME#v} on npm and approve it with 2FA to publish."
          } >> "$GITHUB_STEP_SUMMARY"
